services:
  db:
    image: mysql:8.1
    environment:
      MYSQL_DATABASE: hoteldb
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  backend:
    image: hotel-agence-backend:latest
    ports:
      - "8082:8082"
    depends_on:
      db:
        condition: service_healthy        # ← attend que MySQL soit vraiment prêt
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/hoteldb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    restart: unless-stopped

  frontend:
    image: hotel-agence-frontend:latest
    ports:
      - "4000:4000"
    depends_on:
      backend:
        condition: service_started        # frontend démarre dès que backend est lancé
    restart: unless-stopped

volumes:
  db_data: