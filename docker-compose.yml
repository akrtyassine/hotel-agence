services:
  db:
    image: mysql:8.1
    environment:
      MYSQL_DATABASE: hoteldb
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    restart: unless-stopped

  backend:
    build:
      context: ./hotelagencebackend-master
    image: hotel-agence-backend:latest
    ports:
      - "8082:8082"
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/hoteldb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    restart: unless-stopped

  frontend:
    build:
      context: ./Modern-Booking-master
    image: hotel-agence-frontend:latest
    ports:
      - "4000:4000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
