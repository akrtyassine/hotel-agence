<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel API</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #22c55e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 20% 20%, #1f2937, var(--bg));
      color: var(--text);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      padding: 24px;
    }

    .card {
      width: min(720px, 100%);
      background: linear-gradient(180deg, #111827, #0b1220);
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.6rem;
    }

    p {
      margin: 0 0 16px;
      color: var(--muted);
    }

    ul {
      margin: 0;
      padding-left: 20px;
      line-height: 1.8;
    }

    code {
      color: var(--accent);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Hotel Backend is Running</h1>
    <p>Root path is now available. Use the API endpoints below:</p>
    <ul>
      <li><code>/api/hotels</code></li>
      <li><code>/api/clients</code></li>
      <li><code>/api/reservations</code></li>
      <li><code>/api/avis</code></li>
      <li><code>/api/promotions</code></li>
      <li><code>/api/agences</code></li>
      <li><code>/api/admins</code></li>
      <li><code>/api/auth/login</code></li>
      <li><code>/h2-console</code></li>
    </ul>
  </main>
</body>
</html>
